name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0; Node 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy custom_components/home_sensor_notifications
      - run: python -m compileall -q custom_components
      - run: pytest -q --cov=custom_components.home_sensor_notifications --cov-report=term-missing --cov-fail-under=50
      - run: node --check custom_components/home_sensor_notifications/static/home-sensor-notifications-panel.js
      - run: node --test tests/panel-security.test.cjs
      - run: node --test tests/panel-behavior.test.cjs

  integration:
    name: HACS and Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0; Node 24
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
