name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching manifest.json, for example v1.2.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0; Node 24
        with:
          fetch-depth: 0
      - name: Validate release version and gates
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "${RELEASE_TAG#v}" = "$(python -c 'import json; print(json.load(open("custom_components/home_sensor_notifications/manifest.json"))["version"])')"
          python -m pip install -r requirements-test.txt
          ruff format --check .
          ruff check .
          mypy custom_components/home_sensor_notifications
          pytest -q --cov=custom_components.home_sensor_notifications --cov-fail-under=50
          node --check custom_components/home_sensor_notifications/static/home-sensor-notifications-panel.js
          node --test tests/panel-security.test.cjs
          node --test tests/panel-behavior.test.cjs
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
