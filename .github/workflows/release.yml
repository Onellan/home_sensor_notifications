name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching manifest.json, for example v1.2.1
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0; Node 24
        with:
          fetch-depth: 0
      - name: Verify release version and validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "${RELEASE_TAG#v}" = "$(python -c 'import json; print(json.load(open("custom_components/home_sensor_notifications/manifest.json"))["version"])')"
          gh run list --workflow Validate --commit "$GITHUB_SHA" --status completed --json conclusion --jq 'map(select(.conclusion == "success")) | length > 0' | grep -qx true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
